name: publish-first

# ONE-TIME use, started by hand from the Actions tab (Run workflow). It publishes the first version of the package
# with a short-lived npm token, because npm sets up trusted publishing only on a package that already exists.
# When it has run: delete the secret NPM_TOKEN, revoke the token on npmjs.com, set up the trusted publisher
# (see README, Releasing), and delete this file. Releases after that use publish.yml and no token.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Refuse to run without the token
        run: test -n "$NODE_AUTH_TOKEN" || { echo "The secret NPM_TOKEN is not set" >&2; exit 1; }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install (the tests need no browser, so do not download one)
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
