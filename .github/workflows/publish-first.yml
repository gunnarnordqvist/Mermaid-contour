name: publish-first

# ONE-TIME use, started by hand from the Actions tab (Run workflow). It STAGES the first version of the package with a
# short-lived npm token ("Read and write (stage only)" is enough: that token cannot publish directly). The version
# goes live when you approve it on npmjs.com (Staged Packages, with your two-factor code). npm sets up trusted
# publishing only on a package that already exists, hence this first step.
# When it has run and you have approved: delete the secret NPM_TOKEN, revoke the token on npmjs.com, set up the trusted
# publisher (see README, Releasing), and delete this file. Releases after that use publish.yml and no token.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11.15 or later is needed for `npm stage publish`
        run: |
          npm install -g npm@11
          npm --version
          node -e "const [a,b]=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (a<11||(a===11&&b<15)) { console.error('npm is too old for npm stage publish'); process.exit(1); }"
      - name: Refuse to run without the token
        run: test -n "$NODE_AUTH_TOKEN" || { echo "The secret NPM_TOKEN is not set" >&2; exit 1; }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install (the tests need no browser, so do not download one)
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npm test
      - run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
