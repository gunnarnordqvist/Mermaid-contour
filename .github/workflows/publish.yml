name: publish

# Publishes the package to npm when a version tag is pushed:
#   npm version patch   (or minor, major)  -> edits package.json and creates the tag vX.Y.Z
#   git push --follow-tags
# Needs the repository secret NPM_TOKEN (an npm access token that may publish this package).
# `--provenance` makes npm record that the package was built from this repository by this workflow.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # the identity that provenance is signed with

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: The tag must equal the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)" >&2
            exit 1
          fi
      - name: Install (the tests need no browser, so do not download one)
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npm test
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
