name: publish

# Publishes the package to npm when a version tag is pushed, with npm's trusted publishing (OIDC): there is no
# token to store or leak. npm trusts this exact workflow of this exact repository, which is configured once on the
# package's settings page on npmjs.com (Settings, Trusted publishing: GitHub Actions, user gunnarnordqvist,
# repository Mermaid-contour, workflow filename publish.yml). Provenance is then recorded automatically.
#
#   npm version patch   (or minor, major)  -> edits package.json and creates the tag vX.Y.Z
#   git push --follow-tags
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # lets npm verify which workflow is publishing

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing supports only cloud-hosted runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # trusted publishing needs npm 11.5.1 or later and Node 22.14 or later
          registry-url: https://registry.npmjs.org
      - name: The tag must equal the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)" >&2
            exit 1
          fi
      - name: Install (the tests need no browser, so do not download one)
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npm test
      - run: npm publish
